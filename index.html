<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bennett Institute Mugshots</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
  }
  h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #e94560; }
  #stats {
    font-size: 1.1rem;
    margin-bottom: 1.5rem;
    display: flex;
    gap: 2rem;
    color: #aaa;
  }
  #stats span { color: #fff; font-weight: bold; }
  #card {
    background: #16213e;
    border-radius: 16px;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    max-width: 420px;
    width: 100%;
  }
  #face {
    width: 250px;
    height: 250px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 1.5rem;
    border: 3px solid #0f3460;
  }
  #guess-input {
    width: 100%;
    padding: 0.8rem 1rem;
    font-size: 1.1rem;
    border: 2px solid #0f3460;
    border-radius: 8px;
    background: #1a1a2e;
    color: #fff;
    outline: none;
    transition: border-color 0.2s;
  }
  #guess-input:focus { border-color: #e94560; }
  #guess-input.wrong {
    border-color: #e94560;
    animation: shake 0.4s;
  }
  #guess-input.correct {
    border-color: #4ecca3;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  #feedback {
    margin-top: 1rem;
    font-size: 1rem;
    min-height: 1.5em;
  }
  .wrong-text { color: #e94560; }
  .correct-text { color: #4ecca3; }
  #progress {
    margin-top: 1.5rem;
    width: 100%;
    height: 8px;
    background: #0f3460;
    border-radius: 4px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    background: #4ecca3;
    transition: width 0.3s;
    width: 0%;
  }
  #done {
    display: none;
    text-align: center;
  }
  #done h2 { color: #4ecca3; font-size: 2rem; margin-bottom: 1rem; }
  #done p { font-size: 1.2rem; margin-bottom: 0.5rem; }
  #play-again {
    margin-top: 1.5rem;
    padding: 0.8rem 2rem;
    font-size: 1.1rem;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #play-again:hover { background: #c73652; }
  #mode-select {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  #mode-select p {
    font-size: 1.2rem;
    margin-bottom: 1rem;
    color: #aaa;
  }
  .mode-btn {
    padding: 0.8rem 2rem;
    font-size: 1.1rem;
    border: 2px solid #0f3460;
    border-radius: 8px;
    background: #16213e;
    color: #fff;
    cursor: pointer;
    margin: 0 0.5rem;
    transition: border-color 0.2s, background 0.2s;
  }
  .mode-btn:hover { border-color: #e94560; background: #1a1a2e; }
</style>
</head>
<body>

<h1>Bennett Institute Mugshots</h1>

<div id="mode-select">
  <p>Choose difficulty:</p>
  <button class="mode-btn" data-mode="easy">Easy (first name)</button>
  <button class="mode-btn" data-mode="hard">Hard (full name)</button>
</div>

<div id="stats" style="display:none">
  <div>Time: <span id="timer">0:00</span></div>
  <div>Score: <span id="score">0</span> / <span id="total">64</span></div>
</div>

<div id="card" style="display:none">
  <img id="face" src="" alt="Who is this?">
  <input type="text" id="guess-input" placeholder="Enter full name..." autocomplete="off">
  <div id="feedback"></div>
  <div id="progress"><div id="progress-bar"></div></div>
</div>

<div id="done">
  <h2>You got them all!</h2>
  <p>Time: <span id="final-time"></span></p>
  <p>Wrong guesses: <span id="wrong-count"></span></p>
  <button id="play-again">Play Again</button>
</div>

let shuffled, current, wrongGuesses, correctCount, startTime, timerInterval, mode;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function updateTimer() {
  document.getElementById('timer').textContent = formatTime(Date.now() - startTime);
}

function getAnswer(person) {
  return mode === 'easy' ? person.name.split(' ')[0] : person.name;
}

function showPerson() {
  const person = shuffled[current];
  document.getElementById('face').src = BASE + person.image_url;
  const input = document.getElementById('guess-input');
  input.value = '';
  input.className = '';
  input.placeholder = mode === 'easy' ? 'Enter first name...' : 'Enter full name...';
  document.getElementById('feedback').textContent = '';
  input.focus();
}

function startGame(selectedMode) {
  mode = selectedMode;
  shuffled = shuffle(people);
  current = 0;
  correctCount = 0;
  wrongGuesses = 0;
  startTime = Date.now();
  document.getElementById('mode-select').style.display = 'none';
  document.getElementById('stats').style.display = 'flex';
  document.getElementById('total').textContent = people.length;
  document.getElementById('score').textContent = '0';
  document.getElementById('card').style.display = 'flex';
  document.getElementById('done').style.display = 'none';
  document.getElementById('progress-bar').style.width = '0%';
  timerInterval = setInterval(updateTimer, 1000);
  showPerson();
}

function normalize(s) {
  return s.trim().toLowerCase().replace(/[^a-z\s]/g, '').replace(/\s+/g, ' ');
}

document.getElementById('guess-input').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const input = document.getElementById('guess-input');
  const feedback = document.getElementById('feedback');
  const answer = normalize(getAnswer(shuffled[current]));
  const guess = normalize(input.value);

  if (guess === answer) {
    input.className = 'correct';
    feedback.innerHTML = '<span class="correct-text">Correct!</span>';
    current++;
    correctCount++;
    document.getElementById('score').textContent = correctCount;
    document.getElementById('progress-bar').style.width = (correctCount / people.length * 100) + '%';

    if (correctCount >= people.length) {
      clearInterval(timerInterval);
      updateTimer();
      document.getElementById('card').style.display = 'none';
      document.getElementById('done').style.display = 'block';
      document.getElementById('final-time').textContent = formatTime(Date.now() - startTime);
      document.getElementById('wrong-count').textContent = wrongGuesses;
    } else {
      setTimeout(showPerson, 600);
    }
  } else {
    wrongGuesses++;
    input.className = 'wrong';
    feedback.innerHTML = '<span class="wrong-text">Wrong! It\'s <strong>' + getAnswer(shuffled[current]) + '</strong></span>';
    input.disabled = true;
    // Re-insert this person at a random later position
    const person = shuffled[current];
    const insertAt = current + 1 + Math.floor(Math.random() * Math.max(1, shuffled.length - current - 1));
    shuffled.splice(insertAt, 0, person);
    current++;
    setTimeout(() => {
      input.disabled = false;
      showPerson();
    }, 2000);
  }
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => startGame(btn.dataset.mode));
});

document.getElementById('play-again').addEventListener('click', () => {
  document.getElementById('mode-select').style.display = 'block';
  document.getElementById('stats').style.display = 'none';
  document.getElementById('done').style.display = 'none';
});
